project:
  type: website
  output-dir: ../docs/nb389
  render:
    - "notebook30.qmd"
    - "notebook31.qmd"
    - "notebook32.qmd"
website:
  title: "Foundations of Data Science: Notebooks"
  sidebar:
    style: docked
    search: true
    contents:
      - file: notebook30.qmd
        text: "Notebook30"
      - file: notebook31.qmd
        text: "Notebook31"
      - file: notebook32.qmd
