[project]
name = "fds2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "en-core-web-sm",
    "folium>=0.20.0",
    "fr-core-news-sm",
    "geopandas>=1.1.4",
    "igraph>=1.0.0",
    "mapclassify>=2.10.0",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "opencv-python>=5.0.0.93",
    "plotnine>=0.15.7",
    "polars>=1.42.1",
    "protobuf>=7.35.1",
    "pyarrow>=25.0.0",
    "pyyaml>=6.0.3",
    "requests-cache>=1.3.3",
    "scikit-learn>=1.9.0",
    "sentencepiece>=0.2.2",
    "spacy>=3.8.14",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.13.1",
    "umap-learn>=0.5.12",
]

[tool.uv.sources]
# spaCy's trained pipelines are not published to PyPI; they are release assets on
# the spacy-models repo. Pinning them here keeps `uv sync` from dropping them,
# which otherwise breaks the render of ch14 (English) and ch15 (French).
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
